# Declaration of this repository to the SDLC chain (homelab-sdlc-core, docs/chaine.md).
# langue_publique: the language of what a version publishes (Release notes, tag messages);
# the merge pod's language guard refuses French ones.
langue_publique: en
# deploiement: the images this repository builds and its application names (vault paths
# apps/<name>, oidc/<name>); the chain deploys them to k8s-home-lab after a release.
deploiement:
  images: [ghcr.io/antorfr/kanevas]
  applis: [kanevas]
# tests: the suite the chain plays (`attester`, base measured on the target). Same files as `npm test`.
tests:
  commande: npm ci && npm run tests:attestes
  rapport: resultats.tap
  format: tap
  delai: 50m
