# Declaration of this repository to the SDLC chain (homelab-sdlc-core, docs/chaine.md).
# langue_publique: the language of what a version publishes (Release notes, tag messages);
# the merge pod's language guard refuses French ones.
langue_publique: en
# deploiement: the images this repository builds and its application names (vault paths
# apps/<name>, oidc/<name>); the chain deploys them to k8s-home-lab after a release.
deploiement:
  images: [ghcr.io/antorfr/kanevas]
  applis: [kanevas]
# tests: the suite the chain plays (`attester`, base measured on the target). Same files as `npm test`.
tests:
  installation: npm ci && npm run build:wasm
  fichiers: node scripts/rejouer-tests.mjs --fichiers {tests}
  outillage: [scripts/tests-attestes.mjs, scripts/niveaux-tests.mjs, scripts/rejouer-tests.mjs, scripts/playwright.mjs]
  commande: npm ci && node scripts/tests-attestes.mjs
  local: npm ci && node scripts/tests-attestes.mjs --local
  ecrans: node scripts/tests-attestes.mjs --ecrans {base} --installe
  ecrans_liste: npm ci --ignore-scripts --loglevel=error >/dev/null && node scripts/niveaux-tests.mjs --liste ecrans {base}
  fiche: npm ci && node scripts/tests-attestes.mjs --fiche {base}
  rejouer: node scripts/rejouer-tests.mjs {tests} --installe
  rapport: resultats.tap
  format: tap
  delai: 90m
