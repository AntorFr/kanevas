<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Éditeur de carte — Kanevas</title><style>

:root{--bg:#101012;--s1:#1a1a1f;--s2:#212127;--b:rgba(255,255,255,.07);--bs:rgba(255,255,255,.15);--i1:#f5f4f2;--i2:#a3a2a8;--i3:#6b6a72;--vi:#8b7cf6;--vis:#aca2f9;--vid:rgba(139,124,246,.16);--am:#f2a33c;--te:#3fc79a;--serif:ui-serif,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i1);font:14px var(--sans)}
header{height:50px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--b)}header h1{font:17px var(--serif);margin:0;flex:1}
button{background:var(--s2);color:var(--i1);border:1px solid var(--bs);border-radius:8px;padding:7px 12px;font:inherit;min-height:34px}button.p{background:var(--vi);color:#0b0b10;border-color:var(--vi)}
.row{display:flex;height:calc(100vh - 50px);min-height:520px}.tools{width:56px;border-right:1px solid var(--b);display:flex;flex-direction:column;gap:6px;padding:8px;align-items:center}.tools button{width:40px;padding:0}.tools .on{background:var(--vid);border-color:var(--vi);color:var(--vis)}
.side{width:300px;border-left:1px solid var(--b);display:flex;flex-direction:column}.tabs{display:flex;border-bottom:1px solid var(--b)}.tabs span{flex:1;text-align:center;padding:10px;color:var(--i2)}.tabs .on{color:var(--vis);border-bottom:2px solid var(--vi)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.card{background:var(--s1);border:1px solid var(--b);border-radius:8px;padding:6px;font-size:12px;color:var(--i2)}.card i{display:block;height:56px;border-radius:5px;margin-bottom:4px;background:repeating-conic-gradient(#2a2a31 0 25%,#1f1f25 0 50%) 0 0/12px 12px}
.cv{flex:1;position:relative;overflow:hidden;background:#0c0c0e}.map{position:absolute;inset:40px;background:linear-gradient(var(--b) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--b) 1px,transparent 1px) 0 0/40px 40px,#17171c}
.fl{position:absolute;background:#3a342c}.wl{position:absolute;background:#c9c3b8}.ob{position:absolute;border-radius:6px;background:var(--vid);border:1px solid var(--vi)}.mj{background:repeating-linear-gradient(135deg,rgba(242,163,60,.25) 0 6px,transparent 6px 12px);border:1px dashed var(--am)}
.fog{position:absolute;background:rgba(0,0,0,.92)}.fogmj{background:repeating-linear-gradient(135deg,rgba(242,163,60,.28) 0 6px,rgba(0,0,0,.35) 6px 12px)}.tk{position:absolute;width:36px;height:36px;border-radius:50%;border:2px solid var(--te);background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:12px}
.lay{padding:10px;display:flex;flex-direction:column;gap:6px}.lay div{display:flex;gap:8px;padding:8px;background:var(--s1);border:1px solid var(--b);border-radius:8px}.lay .m{border-color:var(--am);color:var(--am)}
@media(max-width:760px){.side{display:none}.tools{width:44px}}
</style></head><body>
<header><h1>Cantine de la station · 30 × 20</h1><button>Annuler</button><button>Rétablir</button><button class="p">Jouer</button></header>
<div class="row"><div class="tools"><button class="on" title="Sélection">↖</button><button title="Sol">▦</button><button title="Mur">▭</button><button title="Porte">⌸</button><button title="Poser un asset">＋</button><button title="Gomme">⌫</button></div>
<div class="cv"><div class="map"><div class="fl" style="left:80px;top:80px;width:360px;height:240px"></div><div class="wl" style="left:80px;top:78px;width:360px;height:4px"></div><div class="wl" style="left:80px;top:318px;width:360px;height:4px"></div><div class="wl" style="left:78px;top:80px;width:4px;height:240px"></div><div class="wl" style="left:438px;top:80px;width:4px;height:240px"></div>
<div class="ob" style="left:120px;top:120px;width:80px;height:40px"></div><div class="ob" style="left:240px;top:200px;width:80px;height:40px"></div><div class="ob mj" style="left:480px;top:120px;width:120px;height:120px"></div></div></div>
<div class="side"><div class="tabs"><span class="on">Bibliothèque</span><span>Calques</span><span>Propriétés</span></div><div style="padding:10px"><input placeholder="Rechercher un asset" style="width:100%;background:var(--s1);border:1px solid var(--bs);border-radius:8px;color:var(--i1);padding:8px"></div>
<div class="grid"><div class="card"><i></i>Table · 2×1</div><div class="card"><i></i>Banc · 2×1</div><div class="card"><i></i>Console · 1×1</div><div class="card"><i></i>Fourneau · 2×2</div><div class="card"><i></i>Caisse · 1×1</div><div class="card"><i></i>Dalle métal</div></div>
<div class="lay"><div>👁 Objets</div><div>👁 Murs</div><div class="m">👁 Réservé au MJ · salle cachée</div></div></div></div></body></html>
