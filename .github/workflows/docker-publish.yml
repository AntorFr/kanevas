name: docker-publish

# The image is built only on a `v*` tag whose commit (or a parent of the same tree) carries the
# status « tests-complets », posted by `attester --publier` : state `success` and a description
# that starts with « niveau » (« niveau fiche · … », AD-niveau-7) — a status that does not say
# its level is refused. This workflow plays no test: it checks the proof. No run on a branch push or a pull request.
on:
  push:
    tags: ['v*']            # → SemVer tags :X.Y.Z :X.Y :X, and :latest for the highest
                            #   (metadata-action's default flavor). A GitHub Release only
                            #   carries the notes: it builds nothing a second time.
  workflow_dispatch:        # a tag attested after it was pushed: re-run it from here

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # metadata-action lowercases it

jobs:
  attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      statuses: read
    steps:
      # The parents too: a PR merge makes a new commit, whose content is the attested head's
      # when that head already contained the target. Same TREE, same content: the proof holds.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Une attestation qui dit son niveau existe sur ce contenu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arbre=$(git rev-parse 'HEAD^{tree}')
          for c in $(git rev-list --parents -n 1 HEAD); do
            [ "$(git rev-parse "$c^{tree}")" = "$arbre" ] || continue
            st=$(gh api "repos/${{ github.repository }}/commits/$c/status" \
              --jq '.statuses[] | select(.context == "tests-complets") | .state + " " + .description' | head -1)
            case "$st" in
              "success niveau "*)
                echo "Attestation sur $c (arbre ${arbre:0:7}) : ${st#* }"
                exit 0
                ;;
            esac
          done
          echo "::error::No green « tests-complets » attestation that says its level (description starting with « niveau ») on this content (tree ${arbre:0:7}, commit ${{ github.sha }} nor its same-tree parents). Run attester --publier on the pushed commit, then re-run this workflow."
          exit 1

  build:
    needs: attestation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # multi-arch
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}             # :X.Y.Z
            type=semver,pattern={{major}}.{{minor}}     # :X.Y
            type=semver,pattern={{major}}               # :X
            type=sha,prefix=sha-                        # :sha-abc1234

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Version embedded in the image: derived from the same semver tag
          # `meta` uses for the published image tag, never from package.json
          # — a single source of truth for both.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # Multi-arch only on a clean stable tag (vX.Y.Z without suffix);
          # pre-releases stay amd64-only for fast builds.
          platforms: >-
            ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
                && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # AD-web-publie-5: the built web page, attached to the Release of the tag, behind the same
  # attestation as the image. No Rust here: the Dockerfile's `web` stage does the build (shared cache).
  web:
    needs: attestation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}

      - name: Export the web stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          outputs: type=local,dest=${{ runner.temp }}/web
          cache-from: type=gha

      - name: Archive and checksum
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/out"
          archive="kanevas-web-${VERSION}.tar.gz"
          tar -C "$RUNNER_TEMP/web" -czf "$RUNNER_TEMP/out/$archive" .
          (cd "$RUNNER_TEMP/out" && sha256sum "$archive" > "$archive.sha256")

      - name: Attach to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            pre=""
            case "$tag" in *-*) pre="--prerelease" ;; esac
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$tag" --notes 'Web build of this version.' $pre
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            "$RUNNER_TEMP/out/kanevas-web-${VERSION}.tar.gz" \
            "$RUNNER_TEMP/out/kanevas-web-${VERSION}.tar.gz.sha256"
