name: docker-publish

# The image is built only from a commit whose full suite was played and attested (status
# « tests-complets », posted by `npm run tests:attestes -- --publier` from a laptop, a pod
# of the chain, or the manual « tests » workflow). This workflow runs no test: it checks the
# proof. Decision of 2026-10-13: tests wherever they run best, one proof, and a commit pushed
# by hand without tests never becomes an image. No more automatic run on main or on PRs.
on:
  push:
    tags: ['v*']            # → SemVer tags :X.Y.Z :X.Y :X
  release:
    types: [published]      # → also tag :latest
  workflow_dispatch:        # a tag attested after it was pushed: rebuild it from here

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # metadata-action lowercases it

jobs:
  attestation:
    runs-on: ubuntu-latest
    steps:
      - name: La suite complète a été jouée sur ce commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etat=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
            --jq '.statuses[] | select(.context == "tests-complets") | .state' | head -1)
          desc=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/status" \
            --jq '.statuses[] | select(.context == "tests-complets") | .description' | head -1)
          if [ "$etat" != success ]; then
            echo "::error::Pas d'attestation « tests-complets » verte sur ${{ github.sha }} (${etat:-absente}). Jouer la suite : npm run tests:attestes -- --publier, ou le workflow « tests » sur ce tag ; il relance ce build."
            exit 1
          fi
          echo "Attestation : $desc"

  build:
    needs: attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3      # multi-arch
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}             # :X.Y.Z
            type=semver,pattern={{major}}.{{minor}}     # :X.Y
            type=semver,pattern={{major}}               # :X
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-                        # :sha-abc1234

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Version embedded in the image: derived from the same semver tag
          # `meta` uses for the published image tag, never from package.json
          # — a single source of truth for both.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          # Multi-arch only on a clean stable tag (vX.Y.Z without suffix);
          # pre-releases stay amd64-only for fast builds.
          platforms: >-
            ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
                && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
